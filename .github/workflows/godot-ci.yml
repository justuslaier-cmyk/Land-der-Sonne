name: Godot foundation checks

on:
  push:
    branches: [main, design/galactic-grand-strategy-pivot]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: godot-foundation-${{ github.ref }}
  # Keep a complete validation run instead of repeatedly cancelling it on rapid commits.
  cancel-in-progress: false

jobs:
  godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 stable
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project
        run: godot --headless --path game --editor --quit
      - name: Run deterministic smoke test
        run: godot --headless --path game --script res://tests/smoke_test.gd
      - name: Test world state and chunk coordinates
        run: godot --headless --path game --script res://tests/world_test.gd
      - name: Test player input and scene interaction
        run: godot --headless --path game --script res://tests/interaction_test.gd
      - name: Test galactic new game and persistence
        run: timeout 100s godot --headless --path game --script res://tests/galaxy_test.gd
      - name: Verify military supply, battle losses and repairs
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_military_logistics_test.gd
      - name: Verify fleet orders, admiral effects and persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_fleet_command_test.gd
      - name: Verify ship blueprints, roles and propulsion research gates
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_ship_blueprints_test.gd
      - name: Verify espionage, intelligence levels and counterintelligence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_espionage_test.gd
      - name: Verify alliances, dependencies and war protection
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_alliances_dependencies_test.gd
      - name: Verify timed diplomatic negotiations and ratification
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_diplomatic_negotiations_test.gd
      - name: Verify archaeological breakthroughs and one-time research insights
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_research_breakthroughs_test.gd
      - name: Verify research laboratories and technology effects
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_research_effects_test.gd
      - name: Verify specialised research prerequisites and persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_research_branches_test.gd
      - name: Verify government transitions, legitimacy crises and persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_institutions_test.gd
      - name: Verify political bloc support, opposition and reform resistance
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_political_blocs_test.gd
      - name: Verify governance reform approval, delay and save persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_governance_reforms_test.gd
      - name: Verify freight reserves, in-transit commitments and stock balance
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_freight_reserves_test.gd
      - name: Verify delayed freight delivery, blockades and persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_freight_transit_test.gd
      - name: Verify civilian freight paths, capacities and transport costs
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_freight_routes_test.gd
      - name: Verify manufactured goods market and inventory conservation
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_manufactures_market_test.gd
      - name: Verify multi-stage production chains and material conservation
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_production_chains_test.gd
      - name: Verify civilian goods production, consumption and stock conservation
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_goods_ledger_test.gd
      - name: Verify cohort migration and long-term population accounting
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_migration_cohorts_test.gd
      - name: Verify fertility, mortality, ageing and labor accounting
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_demographic_flows_test.gd
      - name: Verify civilian demographics, employment and save compatibility
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_demographics_test.gd
      - name: Verify long-term cultural stability, generations and AI replay
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_culture_longrun_test.gd
      - name: Verify cultural groups and economic simulation effects
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_culture_effects_test.gd
      - name: Verify cultural development, generations and save persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_culture_test.gd
      - name: Verify colony growth, environmental limits and forecast
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_colony_simulation_test.gd
      - name: Verify planetary ecology, colony capacity and pollution
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_planet_colonization_test.gd
      - name: Verify stellar classes and colonizable capital planets
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_planet_systems_test.gd
      - name: Verify connected galaxy geography at minimum, default and maximum scale
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_geography_test.gd
      - name: Verify map navigation, survey and fleet route previews
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_navigation_test.gd
      - name: Verify seeded galaxy starts and rival capital spacing
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_start_spacing_test.gd
      - name: Test new-game wizard navigation and seed persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_wizard_test.gd
      - name: Test strategic simulation systems
        run: timeout 100s godot --headless --path game --script res://tests/galaxy_systems_test.gd
      - name: Test empire strategy and shipbuilding
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_strategy_test.gd
      - name: Test procedural star systems
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_celestials_test.gd
      - name: Test planet economy
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_planet_economy_test.gd
      - name: Test ancient history and branching events
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_lore_test.gd
      - name: Verify fleet doctrines and combat experience
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_fleet_doctrine_test.gd
      - name: Verify treaty trust and diplomatic decay
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_diplomacy_trust_test.gd
      - name: Verify annual economy forecast against simulation
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_forecast_test.gd
      - name: Test optional exploration automation
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_automation_test.gd
      - name: Verify civilization civics, species traits and persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_identity_test.gd
      - name: Test non-linear galactic objectives and persistence
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_progress_test.gd
      - name: Verify world contracts and deterministic twelve-tick replay
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_contracts_test.gd
      - name: Test autonomous rival empires
        run: timeout 60s godot --headless --path game --script res://tests/galaxy_ai_test.gd
      - name: Load main scene
        run: godot --headless --path game --quit-after 10


  regression-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script:
          - galaxy_story_chains_test.gd
          - galaxy_narrative_director_test.gd
          - galaxy_ai_planner_test.gd
          - galaxy_ai_scaling_test.gd
          - galaxy_ai_soak_test.gd
          - galaxy_visual_theme_test.gd
          - galaxy_event_card_test.gd
          - galaxy_ui_accessibility_test.gd
          - galaxy_art_resources_test.gd
          - galaxy_art_ui_smoke_test.gd
          - galaxy_full_integration_test.gd
          - galaxy_ui_interaction_regression_test.gd
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 stable
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path game --editor --quit
      - name: Execute isolated regression
        run: timeout 120s godot --headless --path game --script "res://tests/${{ matrix.script }}"

  render-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 stable
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Import project
        run: godot --headless --path game --editor --quit
      - name: Capture real engine render
        run: xvfb-run -a -s "-screen 0 1920x1080x24" godot --path game --rendering-method gl_compatibility --script res://tests/render_capture.gd
      - name: Publish screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: godot-render-evidence
          path: ~/.local/share/godot/app_userdata/Land der Sonne/render-*.png
          if-no-files-found: error
          retention-days: 7

  windows-export:
    needs: [godot-smoke, regression-matrix, render-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install editor and export templates
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 --output /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Import and export Windows x86_64
        run: |
          godot --headless --path game --editor --quit
          mkdir -p dist
          godot --headless --path game --export-release "Windows Desktop" ../dist/LandDerSonne.exe
          test -s dist/LandDerSonne.exe
          test -s dist/LandDerSonne.pck
          printf 'Land der Sonne - Windows x64 experimental build\n' > dist/BUILD_INFO.txt
          printf 'Commit: %s\n' "$GITHUB_SHA" >> dist/BUILD_INFO.txt
          printf 'Workflow: %s\n' "$GITHUB_RUN_ID" >> dist/BUILD_INFO.txt
          printf 'Godot: 4.3 stable\n' >> dist/BUILD_INFO.txt
          printf 'Validation: godot-smoke, regression-matrix, render-check required\n' >> dist/BUILD_INFO.txt
          (cd dist && sha256sum LandDerSonne.exe LandDerSonne.pck > SHA256SUMS.txt)
          (cd dist && zip -9 LandDerSonne-Windows-x64.zip LandDerSonne.exe LandDerSonne.pck BUILD_INFO.txt SHA256SUMS.txt)
          test -s dist/LandDerSonne-Windows-x64.zip
      - name: Publish experimental Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LandDerSonne-Windows-experimental
          path: dist/LandDerSonne-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
